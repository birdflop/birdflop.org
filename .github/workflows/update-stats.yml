name: Update stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stats.json
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, re, urllib.request, datetime

          stats = json.load(open("stats.json"))
          today = datetime.date.today()

          # 1. CS Room: scrape the figure csroom.org publishes
          #    ("Teachers at 51 schools and universities in 22 countries use it today")
          try:
              req = urllib.request.Request("https://www.csroom.org/", headers={"User-Agent": "Mozilla/5.0 (birdflop.org stats updater)"})
              html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
              m = re.search(r"Teachers at (\d+) schools and\s+universities in (\d+) countries", html)
              if m:
                  stats["csroom_schools"] = int(m.group(1))
                  stats["csroom_countries"] = int(m.group(2))
                  print("csroom:", m.group(1), "schools,", m.group(2), "countries")
              else:
                  print("csroom: pattern not found, keeping previous value")
          except Exception as e:
              print("csroom: fetch failed, keeping previous value:", e)

          # 2. birdflop.com: 30-day unique visitors from Cloudflare zone analytics
          #    (sum of daily uniques, which is how the dashboard's 30-day figure is built)
          tok, zone = os.environ.get("CF_API_TOKEN"), os.environ.get("CF_ZONE_ID")
          if tok and zone:
              since = (today - datetime.timedelta(days=30)).isoformat()
              until = (today - datetime.timedelta(days=1)).isoformat()
              q = {"query": """
                query($zone: String!, $since: Date!, $until: Date!) {
                  viewer { zones(filter: {zoneTag: $zone}) {
                    httpRequests1dGroups(limit: 31, filter: {date_geq: $since, date_leq: $until}) {
                      uniq { uniques }
                    } } } }""",
                   "variables": {"zone": zone, "since": since, "until": until}}
              req = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql",
                  data=json.dumps(q).encode(), headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  res = json.load(urllib.request.urlopen(req, timeout=30))
                  groups = res["data"]["viewer"]["zones"][0]["httpRequests1dGroups"]
                  total = sum(g["uniq"]["uniques"] for g in groups)
                  if total > 0:
                      stats["birdflop_visitors_30d"] = total
                      print("cloudflare: ", total, "uniques over", len(groups), "days")
              except Exception as e:
                  print("cloudflare: failed, keeping previous value:", e, res if 'res' in dir() else "")
          else:
              print("cloudflare: CF_API_TOKEN / CF_ZONE_ID not set, keeping previous value")

          stats["updated"] = today.isoformat()
          json.dump(stats, open("stats.json", "w"), indent=2)
          open("stats.json", "a").write("\n")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "no change" || git commit -m "Update stats" && git push
